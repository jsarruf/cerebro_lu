[project]
name = "cerebro-lu-api"
version = "0.1.0"
description = "API REST conversacional para agente de vendas com FastAPI e Google ADK."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "python-dotenv==1.1.1",
  "google-adk==1.9.0",
  "google-genai==1.28.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cerebro_lu = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
