services:
  api:
    build: .
    init: true
    ports:
      - "8000:8000"
    environment:
      CHAT_ENGINE: ${CHAT_ENGINE:-local}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ADK_MODEL: ${ADK_MODEL:-gemini-3.1-flash-lite}
      ADK_TIMEOUT_SECONDS: ${ADK_TIMEOUT_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
